name: SDMON app checks

on:
  push:
    branches: ["feature/sdmon-app"]
    paths:
      - "apps/**"
      - ".github/workflows/sdmon-app-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"

permissions:
  contents: read

jobs:
  api:
    name: API syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check

  portal:
    name: Portal production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
